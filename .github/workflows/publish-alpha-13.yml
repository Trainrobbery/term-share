name: Publish Term Share alpha.13

on:
  push:
    branches: [release/0.1.0-alpha.13]
    paths: [.github/workflows/publish-alpha-13.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-term-share-alpha-13
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/0.1.0-alpha.13'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-alpha.13
    steps:
      - name: Check out release sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and validate release files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, zipfile
          root = Path.cwd()
          manifest_path = root / 'module.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['id'] == 'term-share'
          assert manifest['version'] == '0.1.0-alpha.13'
          assert manifest['compatibility'] == {'minimum': '13', 'maximum': '14'}
          assert manifest['manifest'] == 'https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json'
          filename = 'Term-Share-0.1.0-alpha.13-V13.zip'
          assert manifest['download'] == 'https://github.com/Trainrobbery/term-share/releases/download/v0.1.0-alpha.13/' + filename
          for name in manifest['esmodules'] + manifest['styles'] + [lang['path'] for lang in manifest['languages']]:
              assert (root / name).is_file(), name
          dist = root / 'dist'
          dist.mkdir()
          (dist / 'module.json').write_bytes(manifest_path.read_bytes())
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(dist / filename, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(paths):
                  if not name or name.startswith('.github/') or name == '.gitignore':
                      continue
                  path = root / name
                  assert path.is_file() and not path.is_symlink(), name
                  assert '..' not in Path(name).parts and 'node_modules' not in Path(name).parts
                  archive.write(path, 'term-share/' + name)
          with zipfile.ZipFile(dist / filename) as archive:
              assert archive.testzip() is None
              assert archive.read('term-share/module.json') == (dist / 'module.json').read_bytes()
          print('Release ZIP and manifest validated.')
          PY
          cat > dist/release-notes.md <<'NOTES'
          장서 카드의 글꼴을 Foundry 기본 글꼴로 되돌렸습니다.
          
          - 카드와 제목에 지정했던 별도 font-family를 제거했습니다.
          - 장서 카드의 색상·글자 크기·여백·테두리·배치와 기존 기능은 유지합니다.
          - 기존 카드도 새로고침하거나 다시 렌더링하면 적용됩니다. 저장된 메시지와 사전 데이터는 수정하지 않습니다.
          
          설치·업데이트 Manifest URL:
          https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json
          
          기존 자동 테스트 63개 통과. Foundry V13–V14 호환 설정을 유지합니다.
          이번 수정에서 실제 Foundry 화면·OS IME 검증을 추가 실행하지 않았습니다.
          NOTES
      - name: Create draft and upload both assets
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Term Share 0.1.0-alpha.13" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" dist/Term-Share-0.1.0-alpha.13-V13.zip dist/module.json
      - name: Verify assets and publish
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'assets']))
          assert {asset['name'] for asset in release['assets']} == {'Term-Share-0.1.0-alpha.13-V13.zip', 'module.json'}
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
