name: Publish Term Share alpha.11

on:
  push:
    branches: [release/0.1.0-alpha.11]
    paths: [.github/workflows/publish-alpha-11.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-term-share-alpha-11
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/0.1.0-alpha.11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-alpha.11
    steps:
      - name: Check out release sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and validate release files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, zipfile
          root = Path.cwd()
          manifest_path = root / 'module.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['id'] == 'term-share'
          assert manifest['version'] == '0.1.0-alpha.11'
          assert manifest['compatibility'] == {'minimum': '13', 'maximum': '14'}
          assert manifest['manifest'] == 'https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json'
          filename = 'Term-Share-0.1.0-alpha.11-V13.zip'
          assert manifest['download'] == 'https://github.com/Trainrobbery/term-share/releases/download/v0.1.0-alpha.11/' + filename
          for name in manifest['esmodules'] + manifest['styles'] + [lang['path'] for lang in manifest['languages']]:
              assert (root / name).is_file(), name
          dist = root / 'dist'
          dist.mkdir()
          (dist / 'module.json').write_bytes(manifest_path.read_bytes())
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(dist / filename, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(paths):
                  if not name or name.startswith('.github/') or name == '.gitignore':
                      continue
                  path = root / name
                  assert path.is_file() and not path.is_symlink(), name
                  assert '..' not in Path(name).parts and 'node_modules' not in Path(name).parts
                  archive.write(path, 'term-share/' + name)
          with zipfile.ZipFile(dist / filename) as archive:
              assert archive.testzip() is None
              assert archive.read('term-share/module.json') == (dist / 'module.json').read_bytes()
          print('Release ZIP and manifest validated.')
          PY
          cat > dist/release-notes.md <<'NOTES'
          한글을 입력하는 도중에도 자동완성 목록을 즉시 갱신하도록 개선했습니다.
          
          - /? 중 뒤에 공백을 추가하지 않아도 일치하는 추천이 표시됩니다.
          - 글자 추가·삭제와 조합 변경에 맞춰 목록을 필터링합니다.
          - ProseMirror의 확정 상태보다 앞선 화면 글자는 추천 검색에만 읽고, 입력 본문과 커서는 다시 쓰지 않습니다.
          - 조합 중 Tab·마우스로 고른 항목은 글자 확정 후 적용해 중복을 방지합니다.
          
          설치·업데이트 Manifest URL:
          https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json
          
          자동 테스트 63개 통과. 실제 운영체제 IME 검증과 합성 이벤트 검사의 차이는 docs/LIVE-SUGGESTIONS-FIX.md 및 docs/TEST-REPORT.md를 참고하세요.
          NOTES
      - name: Create draft and upload both assets
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Term Share 0.1.0-alpha.11" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" dist/Term-Share-0.1.0-alpha.11-V13.zip dist/module.json
      - name: Verify assets and publish
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'assets']))
          assert {asset['name'] for asset in release['assets']} == {'Term-Share-0.1.0-alpha.11-V13.zip', 'module.json'}
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
