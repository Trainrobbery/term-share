name: Publish Term Share alpha.16

on:
  push:
    branches: [release/0.1.0-alpha.16]
    paths: [.github/workflows/publish-alpha-16.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-term-share-alpha-16
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/0.1.0-alpha.16'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-alpha.16
    steps:
      - name: Check out release sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and validate release files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, zipfile
          root = Path.cwd()
          manifest_path = root / 'module.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['id'] == 'term-share'
          assert manifest['version'] == '0.1.0-alpha.16'
          assert manifest['compatibility'] == {'minimum': '13', 'maximum': '14'}
          assert manifest['manifest'] == 'https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json'
          filename = 'Term-Share-0.1.0-alpha.16-V13.zip'
          assert manifest['download'] == 'https://github.com/Trainrobbery/term-share/releases/download/v0.1.0-alpha.16/' + filename
          for name in manifest['esmodules'] + manifest['styles'] + [lang['path'] for lang in manifest['languages']]:
              assert (root / name).is_file(), name
          dist = root / 'dist'
          dist.mkdir()
          (dist / 'module.json').write_bytes(manifest_path.read_bytes())
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(dist / filename, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(paths):
                  if not name or name.startswith('.github/') or name == '.gitignore':
                      continue
                  path = root / name
                  assert path.is_file() and not path.is_symlink(), name
                  assert '..' not in Path(name).parts and 'node_modules' not in Path(name).parts
                  archive.write(path, 'term-share/' + name)
          with zipfile.ZipFile(dist / filename) as archive:
              assert archive.testzip() is None
              assert archive.read('term-share/module.json') == (dist / 'module.json').read_bytes()
          print('Release ZIP and manifest validated.')
          PY
          cat > dist/release-notes.md <<'NOTES'
          Foundry 기본 채팅 카드 양식을 따르는 테마를 추가하고 새 기본값으로 설정했습니다.
          
          - Foundry 기본: 실제 채팅 메시지의 배경·테두리·여백·기본 서체와 본문 목록 스타일을 사용합니다.
          - 자동완성과 사전 목록은 카드 장식 없이 일반 행과 선택/마우스 강조로 표시합니다.
          - 채팅 카드·자동완성·사전 관리·편집·가져오기 UI가 선택한 테마의 색을 함께 사용합니다.
          - 기존 alpha.11 배색과 장서 카드 테마도 선택할 수 있으며 저장된 사용자 선택은 유지합니다.
          - 설정 위치: 게임 설정 → 설정 구성 → Term Share → Term Share 테마
          - 테마 변경은 기존 카드와 열린 UI에 즉시 적용되며 입력 중인 편집기를 재생성하지 않습니다.
          - 메시지 HTML·사전 데이터·기본 채팅 DOM은 보존하며 입력·공유·IME·자동완성 로직은 유지합니다.
          
          설치·업데이트 Manifest URL:
          https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json
          
          자동 테스트 68개 통과. Chrome 독립 HTML 표본으로 세 테마의 밝은/어두운 환경, 기본 틀·목록 스타일 위임과 UI 색상 대비를 확인했습니다.
          Foundry V13–V14 호환 설정을 유지합니다. 실제 Foundry 본체·OS IME 실기 검증과의 차이는 docs/TEST-REPORT.md를 참고하세요.
          NOTES
      - name: Create draft and upload both assets
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Term Share 0.1.0-alpha.16" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" dist/Term-Share-0.1.0-alpha.16-V13.zip dist/module.json
      - name: Verify assets and publish
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'assets']))
          assert {asset['name'] for asset in release['assets']} == {'Term-Share-0.1.0-alpha.16-V13.zip', 'module.json'}
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
