name: Review native and custom Term Share themes
on:
  push:
    branches: [release/0.1.0-alpha.16]
    paths: [.github/workflows/native-theme-qa.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install existing development dependencies
        run: npm ci --ignore-scripts
      - name: Generate actual module UI with representative core styles
        run: node .github/native-theme-fixtures.mjs "$PWD"
      - name: Check three themes in light and dark contexts
        run: |
          for context in light dark; do
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=1500 --window-size=1080,1600 --dump-dom "file://$PWD/dist/theme-qa/$context.html" > "dist/theme-qa/$context.dom.html" 2> "dist/theme-qa/$context.chrome.log"
            for palette in native legacy catalog; do
              google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=1500 --window-size=1080,1600 --screenshot="$PWD/dist/theme-qa/$context-$palette.png" "file://$PWD/dist/theme-qa/$context.html#$palette" >> "dist/theme-qa/$context.chrome.log" 2>&1
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          class Metrics(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.value = ''
              def handle_starttag(self, tag, attrs):
                  if tag == 'pre' and dict(attrs).get('id') == 'qa-metrics':
                      self.capture = True
              def handle_endtag(self, tag):
                  if tag == 'pre':
                      self.capture = False
              def handle_data(self, data):
                  if self.capture:
                      self.value += data
          results = {}
          for context in ['light', 'dark']:
              parser = Metrics()
              parser.feed(Path(f'dist/theme-qa/{context}.dom.html').read_text())
              assert parser.value, context + ': metrics missing'
              result = json.loads(parser.value)
              results[context] = result
              print(context, json.dumps(result))
              assert result.get('ok'), context + ': ' + result.get('error', 'failed')
          Path('dist/theme-qa/metrics.json').write_text(json.dumps(results, indent=2))
          PY
      - name: Save previews and metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-theme-qa
          path: dist/theme-qa
          retention-days: 7
# Includes custom-theme link contrast review.
