name: Publish Term Share alpha.15

on:
  push:
    branches: [release/0.1.0-alpha.15]
    paths: [.github/workflows/publish-alpha-15.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-term-share-alpha-15
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/0.1.0-alpha.15'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-alpha.15
    steps:
      - name: Check out release sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and validate release files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, zipfile
          root = Path.cwd()
          manifest_path = root / 'module.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['id'] == 'term-share'
          assert manifest['version'] == '0.1.0-alpha.15'
          assert manifest['compatibility'] == {'minimum': '13', 'maximum': '14'}
          assert manifest['manifest'] == 'https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json'
          filename = 'Term-Share-0.1.0-alpha.15-V13.zip'
          assert manifest['download'] == 'https://github.com/Trainrobbery/term-share/releases/download/v0.1.0-alpha.15/' + filename
          for name in manifest['esmodules'] + manifest['styles'] + [lang['path'] for lang in manifest['languages']]:
              assert (root / name).is_file(), name
          dist = root / 'dist'
          dist.mkdir()
          (dist / 'module.json').write_bytes(manifest_path.read_bytes())
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(dist / filename, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(paths):
                  if not name or name.startswith('.github/') or name == '.gitignore':
                      continue
                  path = root / name
                  assert path.is_file() and not path.is_symlink(), name
                  assert '..' not in Path(name).parts and 'node_modules' not in Path(name).parts
                  archive.write(path, 'term-share/' + name)
          with zipfile.ZipFile(dist / filename) as archive:
              assert archive.testzip() is None
              assert archive.read('term-share/module.json') == (dist / 'module.json').read_bytes()
          print('Release ZIP and manifest validated.')
          PY
          cat > dist/release-notes.md <<'NOTES'
          카드 형태는 유지하면서 배색만 선택할 수 있는 사용자별 설정을 추가했습니다.
          
          - 기본값: alpha.11 배색 · Foundry의 밝은/어두운 테마에 연동
          - 선택 가능: 장서 카드 배색 · 따뜻한 미색
          - 설정 위치: 게임 설정 → 설정 구성 → Term Share → 채팅 카드 배색
          - 저장 즉시 기존 카드에도 적용되며 재접속 후에도 선택을 유지합니다.
          - 형태·기본 폰트·글자 크기·컴팩트한 여백은 alpha.14와 같습니다.
          - 메시지 본문·사전 데이터·기본 채팅 DOM을 다시 쓰지 않으며, 입력·공유·IME·자동완성·사전 편집은 유지합니다.
          
          설치·업데이트 Manifest URL:
          https://raw.githubusercontent.com/Trainrobbery/term-share/main/module.json
          
          자동 테스트 66개 통과. 배색 기본값·저장된 선택 복원·플레이어 변경, 테마별 색·형태 유지, 기존 카드·링크·우클릭 이벤트 보존을 확인했습니다.
          Foundry V13–V14 호환 설정을 유지합니다. 실제 Foundry 본체·OS IME 실기 검증과의 차이는 docs/TEST-REPORT.md를 참고하세요.
          NOTES
      - name: Create draft and upload both assets
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Term Share 0.1.0-alpha.15" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" dist/Term-Share-0.1.0-alpha.15-V13.zip dist/module.json
      - name: Verify assets and publish
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'assets']))
          assert {asset['name'] for asset in release['assets']} == {'Term-Share-0.1.0-alpha.15-V13.zip', 'module.json'}
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
