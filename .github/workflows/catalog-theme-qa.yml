name: Review catalogue card theme
on:
  push:
    branches: [release/0.1.0-alpha.12]
    paths: [.github/workflows/catalog-theme-qa.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install existing development dependencies
        run: npm ci --ignore-scripts
      - name: Generate isolated fixtures
        run: node .github/catalog-theme-fixtures.mjs "$PWD"
      - name: Check three layouts and capture previews
        run: |
          for theme in light dark narrow; do
            width=560
            if [ "$theme" = narrow ]; then width=280; fi
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=2000 --window-size="$width,1100" --dump-dom "file://$PWD/dist/theme-qa/$theme.html" > "dist/theme-qa/$theme.dom.html" 2> "dist/theme-qa/$theme.chrome.log"
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=2000 --window-size="$width,1100" --screenshot="$PWD/dist/theme-qa/$theme.png" "file://$PWD/dist/theme-qa/$theme.html" >> "dist/theme-qa/$theme.chrome.log" 2>&1
          done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          class Metrics(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.value = ''
              def handle_starttag(self, tag, attrs):
                  if tag == 'pre' and dict(attrs).get('id') == 'qa-metrics':
                      self.capture = True
              def handle_endtag(self, tag):
                  if tag == 'pre':
                      self.capture = False
              def handle_data(self, data):
                  if self.capture:
                      self.value += data
          all_metrics = {}
          for theme in ['light', 'dark', 'narrow']:
              parser = Metrics()
              parser.feed(Path(f'dist/theme-qa/{theme}.dom.html').read_text())
              assert parser.value, theme + ': browser metrics missing'
              result = json.loads(parser.value)
              all_metrics[theme] = result
              print(theme, json.dumps(result, ensure_ascii=False))
              assert result.get('ok'), theme + ': ' + result.get('error', 'failed')
          Path('dist/theme-qa/metrics.json').write_text(json.dumps(all_metrics, ensure_ascii=False, indent=2))
          PY
      - name: Save previews and browser metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-card-theme-qa
          path: dist/theme-qa
          retention-days: 7
